name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: format, lint, types, tests, contracts, build, scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - run: npm run ci
